name: Build APK
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: সর্বশেষ আপলোড করা ZIP খোলা
        run: |
          f=$(git log --diff-filter=AM --name-only --pretty=format: -- '*.zip' | grep -m1 .)
          echo "Using: $f"
          unzip -q "$f" -d proj
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7
      - run: gradle assembleDebug --no-daemon
        working-directory: proj
      - uses: actions/upload-artifact@v4
        with:
          name: ClockWidget-APK
          path: proj/app/build/outputs/apk/debug/app-debug.apk
